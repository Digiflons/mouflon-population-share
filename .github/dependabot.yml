# Weekly update proposals for Python dependencies and GitHub Actions, opened against
# staging (never main). Complements Aikido's scanning.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
